# Plantilla de nginx para el contenedor (SPA + API en el mismo origen).
# docker/entrypoint.sh sustituye ${PORT} por el puerto que asigna Railway.

# Los enlaces de correo llevan el token en el fragmento (#token=...), que el
# navegador no envía al servidor. Como defensa en profundidad, el access log
# tampoco registra el query string y se redacta el path de activación heredado.
map $request_uri $ptwin_safe_uri {
    ~^/v1/auth/activation/ /v1/auth/activation/[redacted];
    ~^([^?]*) $1;
    default /;
}

log_format ptwin_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $ptwin_safe_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';

server {
    listen ${PORT} default_server;
    server_name _;
    server_tokens off;

    root /app/public;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Railway termina TLS. Sin includeSubDomains/preload hasta inventariar
    # todos los subdominios; el navegador ignora HSTS sobre HTTP.
    add_header Strict-Transport-Security "max-age=86400" always;
    # Sanctum detecta peticiones "stateful" por Origin/Referer. `same-origin`
    # conserva el Referer en las llamadas del mismo origen (login por cookie)
    # y lo elimina hacia terceros. Con `no-referrer` los GET del SPA tras
    # recargar llegarían sin sesión y responderían 401.
    add_header Referrer-Policy "same-origin" always;
    # CSP compatible con el SPA: React usa atributos style inline (por ejemplo
    # el avatar y las variables de animación), de ahí style-src 'unsafe-inline'.
    # Los scripts de Vite salen del mismo origen; no se permite eval.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; manifest-src 'self'" always;

    # Compresión para el SPA (los assets ya vienen con hash en el nombre).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Healthchecks de Railway: /up liveness y /ready readiness ----
    location = /up {
        include fastcgi_params;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /ready {
        include fastcgi_params;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Las variantes con barra no son healthchecks válidos.
    location = /up/ { return 404; }
    location = /ready/ { return 404; }

    # ---- API Laravel y cookie CSRF de Sanctum ----
    location ^~ /v1 {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum {
        try_files $uri /index.php?$query_string;
    }

    # ---- APK autorizado ----
    # Solo se sirve la ruta estable; el resto de /apk/** responde 404.
    location = /apk/ProyecTWin.apk {
        root /app/public;
        default_type application/vnd.android.package-archive;
        expires -1;
        try_files $uri =404;
    }

    location = /apk {
        return 404;
    }

    location ^~ /apk/ {
        return 404;
    }

    # ---- Entrada PHP (destino de los rewrites internos) ----
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    # ---- Assets de Vite (nombre con hash: cache de un año) ----
    # `expires` emite Cache-Control sin usar add_header, así no se pierden las
    # cabeceras de seguridad heredadas del bloque server.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # El index.html nunca se cachea: siempre debe apuntar a los assets vigentes.
    location = /index.html {
        expires -1;
    }

    # ---- SPA con fallback para las rutas del cliente (React Router) ----
    location / {
        try_files $uri /index.html;
    }

    # No exponer archivos ocultos (.env, .git, …)
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /dev/stdout ptwin_safe;
    error_log /dev/stderr warn;
}
